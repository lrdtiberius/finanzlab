name: GitHub-Release erstellen

# Kein automatisches Taggen beim Merge: Tag erst nach erfolgreichem PR-Test anlegen.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Release-Tag auschecken
        uses: actions/checkout@v4
      - name: Release-Version prüfen
        run: |
          test "$GITHUB_REF_NAME" = "$(tr -d '[:space:]' < .release-version)"
          test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Alle Regressionstests
        run: |
          python -m unittest discover -s tests -v
          node --check app/static/app.js
          node --check app/static/credit-archive.js
          node tests/test_credit_plan_frontend_243.cjs
          node --test tests/test_startup_v241.cjs
      - name: Release-Quellcode archivieren
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="finanzlab-${GITHUB_REF_NAME}/" HEAD | gzip -9 > "dist/finanzlab-${GITHUB_REF_NAME}.tar.gz"
          sha256sum "dist/finanzlab-${GITHUB_REF_NAME}.tar.gz" > "dist/finanzlab-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Docker-Image bauen und exportieren
        run: |
          docker build --pull --platform linux/amd64 --tag "finanzlab:${GITHUB_REF_NAME#v}" .
          docker save "finanzlab:${GITHUB_REF_NAME#v}" | gzip -9 > "dist/finanzlab-image-${GITHUB_REF_NAME}-amd64.tar.gz"
          sha256sum "dist/finanzlab-image-${GITHUB_REF_NAME}-amd64.tar.gz" > "dist/finanzlab-image-${GITHUB_REF_NAME}-amd64.tar.gz.sha256"
      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/finanzlab-${GITHUB_REF_NAME}.tar.gz" \
            "dist/finanzlab-${GITHUB_REF_NAME}.tar.gz.sha256" \
            "dist/finanzlab-image-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "dist/finanzlab-image-${GITHUB_REF_NAME}-amd64.tar.gz.sha256" \
            --verify-tag \
            --title "FinanzLab ${GITHUB_REF_NAME}" \
            --generate-notes
