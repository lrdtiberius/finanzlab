name: Test and release

on:
  push:
    branches:
      - main
    paths:
      - ".release-version"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Quellstand auschecken
        uses: actions/checkout@v4

      - name: Release-Version bestimmen und Tag bereitstellen
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="$(tr -d '[:space:]' < .release-version)"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              git tag -a "${RELEASE_TAG}" -m "Haushaltsplaner ${RELEASE_TAG}"
              git push origin "${RELEASE_TAG}"
            fi
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests ausführen
        run: |
          python -m unittest discover -s tests -v
          node --check app/static/app.js

      - name: Release-Paket erstellen
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="finanzlab-${RELEASE_TAG}/" HEAD | gzip -9 > "dist/finanzlab-${RELEASE_TAG}.tar.gz"
          shasum -a 256 "dist/finanzlab-${RELEASE_TAG}.tar.gz" > "dist/finanzlab-${RELEASE_TAG}.tar.gz.sha256"

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/finanzlab-${RELEASE_TAG}.tar.gz" \
              "dist/finanzlab-${RELEASE_TAG}.tar.gz.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/finanzlab-${RELEASE_TAG}.tar.gz" \
              "dist/finanzlab-${RELEASE_TAG}.tar.gz.sha256" \
              --verify-tag \
              --title "Haushaltsplaner ${RELEASE_TAG}" \
              --generate-notes
          fi
